
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Backend Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>E-Commerce Store</h1>
    <input type="text" id="searchInput" placeholder="Search products...">
    <select id="categoryFilter">
    <option value="All">All Categories</option>
    <option value="Electronics">Electronics</option>
    <option value="Accessories">Accessories</option>
</select>
<select id="sortPrice">
    <option value="default">Default Order</option>
    <option value="lowToHigh">Price: Low to High</option>
    <option value="highToLow">Price: High to Low</option>
</select>
    <div id="productList"></div>

<h2>Shopping Cart</h2>
<div id="cartList"></div>
<p id="cartSubtotal">Subtotal: 0</p>
<p id="totalItems">Total Items: 0</p>
<p id="uniqueProducts">Unique Products: 0</p>
<p id="taxAmount">Tax: 0</p>
<h3>Apply Coupon</h3>

<input type="text" id="couponInput" placeholder="Enter coupon code">

<button onclick="applyCoupon()">Apply Coupon</button>

<p id="couponMessage"></p> 
<p id="discountAmount">Discount: 0</p>
<p id="finalAmount">Final Amount: 0</p>
<button onclick="placeOrder()">Place Order</button>

<p id="orderMessage"></p>
<h2>Order Summary</h2>
<div id="orderSummary"></div>

<h2>Order History</h2>
<div id="orderHistory"></div>

    <script src="script.js"></script>
</body>
</html>
